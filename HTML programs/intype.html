<!DOCTYPE html>
<h lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="/hmm">
    <div>
            <!--only one ko check karane k liye name attribute pas karna padega 
            jo ki sab ka same hoga -->
            <label for="apple">Apple</label>
            <input type="radio" name="fruit" id="apple" />
            <label for="mango">mango</label>
            <input type="radio" name="fruit" id="mango" value="mango" />
            <!--value pas karne pe name and value dono inform honge-->
            <label for="banana">banana</label>
            <input type="radio" id="banana" name="fruit" />
            <label for="orange">orange</label>
            <input type="radio" name="fruit" id="orange" />
            <br/>
            <button type="submit">submit</button>
        </div>
        <div>
            <br/>
            Choose your profession:
            <select name="profession" id="profession"> 
                <option>select your option</option> 
                <option value="student" >student</option>
                <option value="dev">developer</option>
                <!--pre elect karne ke liye value ke baad 
                secect attribute ka use karke kr sakte hai-->
                <option value="creater">creater</option>
                <option value="photo">photografer</option>
            </select>
        </div>
        <button>submit</button>

</form>
        
        <form action="/save">
            <div>
            <label for="valume">Select your volume label:</label>
            <!--by default value set karne ke liye value attribute ka use karna padega -->
            <input type="range" value="300" id="valume" name="ran" min="0" max="500" step="100">
            <!--for using step attribut range min. or max. steps fom like 100,200,300..-->
            <button>submit</button>
        </div>
    </form>
        <form action="feedbacking">
             <div>
                <label for="feedback">Please provide your valuable feedback:</label>
                <!--for row or col ke liye rows and cols attribut ka use karenge-->
                <textarea id="feedback" name="myfeedb" placeholder="gives your feedback" rows="5" cols="100"></textarea>
                <br/>
                <button>submit</button>
            </div>
        </form>
</body>
